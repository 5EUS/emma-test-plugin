[package]
name = "emma_mangadex"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "A MangaDex source plugin for EMMA, ported from the emma-test-plugin reference."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
